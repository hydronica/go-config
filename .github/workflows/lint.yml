on: [push, pull_request]
name: Lint
permissions:
  contents: read
jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
